name: Upstream sync

on:
  schedule:
    # Every Monday at 03:17 UTC.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/daniil-berg/moodle-tool_monitoring.git
          git fetch upstream main --prune

      - name: Merge upstream main
        run: |
          git merge --no-commit --no-ff upstream/main

      - name: Open upstream update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/upstream-sync
          base: develop
          delete-branch: true
          title: 'chore: sync upstream tool_monitoring'
          commit-message: 'chore: sync upstream tool_monitoring'
          body: |
            This PR synchronises the fork with `daniil-berg/moodle-tool_monitoring`.

            Review compatibility, metadata, documentation, and CI before merging into `develop`.
          labels: |
            upstream-sync
